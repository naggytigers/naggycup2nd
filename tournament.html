<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>naggy杯 決勝トーナメント</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#05050a; --bg-1:#0c0d16;
    --card-bg:rgba(12,13,22,0.86); --card-border:rgba(212,175,55,0.55);
    --gold-1:#f6d365; --gold-2:#c9971f; --gold-3:#8a6a10;
    --ink:#f4f1e8; --ink-dim:#9a9baa;
    --danger:#e05252;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(ellipse 900px 500px at 8% -5%, rgba(56,110,255,0.28), transparent 60%),
      radial-gradient(ellipse 900px 500px at 95% 0%, rgba(230,60,60,0.24), transparent 60%),
      radial-gradient(ellipse 1200px 800px at 50% 110%, rgba(120,90,20,0.18), transparent 60%),
      linear-gradient(180deg, var(--bg-0), var(--bg-1) 40%, var(--bg-0));
    background-attachment:fixed;
    font-family:'Noto Sans JP', sans-serif;
    color:var(--ink);
    padding:28px 16px 60px;
  }
  .wrap{max-width:1180px;margin:0 auto;}

  header.hero{text-align:center;margin-bottom:10px;}
  .hero-title{
    font-size:clamp(24px, 5vw, 44px);line-height:1.15;margin:0;
    display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:baseline;
  }
  .hero-title .naggy{
    font-family:'Poppins',sans-serif;font-weight:800;font-style:italic;
    background:linear-gradient(180deg,#fff6d0 0%, var(--gold-1) 35%, var(--gold-2) 70%, var(--gold-3) 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 2px 0 rgba(0,0,0,0.35);
    filter:drop-shadow(0 0 18px rgba(201,151,31,0.45));
  }
  .hero-title .jp{font-weight:900;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,0.6);}
  .hero-sub{color:var(--ink-dim);font-size:13px;letter-spacing:0.06em;margin-top:6px;}
  .backlink{display:block;text-align:center;color:var(--ink-dim);font-size:12.5px;margin-bottom:20px;text-decoration:none;}
  .backlink:hover{color:var(--gold-1);}

  .editbar{
    display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin:0 0 20px;
  }
  .edit-status{font-size:12.5px;color:var(--ink-dim);font-weight:700;letter-spacing:0.03em;}
  button{
    font-family:inherit;cursor:pointer;border:none;border-radius:9px;font-weight:700;font-size:13.5px;
    padding:9px 18px;transition:transform .1s ease, opacity .15s ease;
  }
  button.small{font-size:12px;padding:6px 12px;}
  button.primary{background:linear-gradient(180deg,var(--gold-1),var(--gold-2));color:#221a06;box-shadow:0 4px 14px rgba(201,151,31,0.35);}
  button.primary:hover{transform:translateY(-1px);}
  button.ghost{background:transparent;border:1px solid rgba(255,255,255,0.2);color:var(--ink-dim);}
  button.ghost:hover{color:var(--ink);border-color:rgba(255,255,255,0.4);}
  .hidden{display:none !important;}

  .login-form{
    max-width:420px;margin:0 auto 26px;background:var(--card-bg);border:1px solid var(--card-border);
    border-radius:12px;padding:16px 18px;box-shadow:0 8px 30px rgba(0,0,0,0.4);
  }
  .field{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--ink-dim);margin-bottom:10px;}
  .field input{
    background:rgba(0,0,0,0.35);border:1px solid rgba(255,255,255,0.15);border-radius:8px;
    color:var(--ink);padding:8px 10px;font-size:14px;font-family:inherit;
  }
  .login-actions{display:flex;gap:8px;}
  .login-form .hint{color:var(--ink-dim);font-size:11px;line-height:1.6;margin:10px 0 0;}
  .error-msg{color:var(--danger);font-size:12.5px;margin:6px 0 0;min-height:1em;}

  .bracket-scroll{overflow-x:auto;padding:6px 4px 20px;}
  .scroll-hint{display:none;text-align:center;color:var(--ink-dim);font-size:11.5px;margin-bottom:10px;}
  .bracket{position:relative;margin:0 auto;}

  .match-box{
    position:absolute;width:190px;height:64px;background:rgba(12,13,22,0.92);
    border:1px solid rgba(212,175,55,0.4);border-radius:8px;overflow:hidden;
    box-shadow:0 4px 14px rgba(0,0,0,0.4);
  }
  .match-box.final-box{border-color:var(--gold-1);box-shadow:0 4px 20px rgba(212,175,55,0.25);}
  .match-row{
    display:flex;align-items:center;gap:5px;height:32px;padding:0 7px;
    border-bottom:1px solid rgba(255,255,255,0.06);
  }
  .match-row:last-child{border-bottom:none;}
  .match-row.winner-row{background:rgba(212,175,55,0.16);}
  .match-row .p-name{
    flex:1;min-width:0;background:transparent;border:none;color:var(--ink);
    font-size:12px;font-family:inherit;padding:2px 0;
  }
  .match-row .p-name:disabled{opacity:1;color:var(--ink);}
  .match-row .p-name.static-name{color:var(--ink-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-style:italic;}
  .match-row .p-name.static-name.filled{color:var(--ink);font-style:normal;}
  .match-row .trophy-mark{font-size:11px;margin-right:2px;flex-shrink:0;}
  .match-row .p-score{
    width:34px;flex-shrink:0;background:rgba(0,0,0,0.35);border:1px solid rgba(255,255,255,0.15);
    border-radius:5px;color:var(--ink);font-size:12px;text-align:center;padding:3px 2px;
  }
  .match-row .p-score:disabled{opacity:0.3;}
  .match-label{position:absolute;font-size:10.5px;color:var(--gold-1);font-weight:700;white-space:nowrap;letter-spacing:0.02em;}

  .stub{position:absolute;height:2px;background:rgba(212,175,55,0.22);}
  .stub.lit{background:linear-gradient(90deg,var(--gold-2),var(--gold-1));box-shadow:0 0 6px rgba(212,175,55,0.55);}
  .vline{position:absolute;width:2px;background:rgba(212,175,55,0.22);}
  .vline.lit{background:linear-gradient(180deg,var(--gold-2),var(--gold-1));box-shadow:0 0 6px rgba(212,175,55,0.55);}

  .champion-card{
    position:absolute;text-align:center;padding:10px 8px;border-radius:10px;
    background:linear-gradient(180deg, rgba(70,52,10,0.75), rgba(18,14,5,0.8));
    border:1px solid var(--card-border);
  }
  .champion-card .cc-label{font-size:9.5px;color:var(--ink-dim);letter-spacing:0.1em;}
  .champion-card .cc-name{font-size:16px;font-weight:900;color:var(--gold-1);margin-top:3px;
    text-shadow:0 0 12px rgba(212,175,55,0.5);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .champion-card.empty .cc-name{color:var(--ink-dim);font-weight:500;font-size:12.5px;text-shadow:none;}

  footer{text-align:center;margin-top:30px;}
  footer .note{color:var(--ink-dim);font-size:11.5px;line-height:1.7;max-width:560px;margin:0 auto 14px;}
  footer button{font-size:11.5px;padding:6px 14px;}

  .toast{
    position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
    background:rgba(20,18,10,0.95);border:1px solid var(--card-border);color:var(--ink);
    padding:10px 18px;border-radius:10px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,0.5);
    opacity:0;pointer-events:none;transition:opacity .25s ease;z-index:50;
  }
  .toast.show{opacity:1;}

  @media (max-width:700px){
    .scroll-hint{display:block;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="hero">
    <h1 class="hero-title"><span class="naggy">naggy杯</span><span class="jp">決勝トーナメント</span></h1>
    <div class="hero-sub">FINAL TOURNAMENT &middot; 8名参加</div>
  </header>
  <a class="backlink" href="index.html">← グループ予選順位表へ</a>

  <div class="editbar">
    <span class="edit-status" id="editStatus">👁 閲覧モード</span>
    <button class="ghost small" id="loginBtn">🔒 編集モードでログイン</button>
    <button class="ghost small hidden" id="logoutBtn">ログアウト</button>
    <button class="ghost small" id="refreshBtn">🔄 最新を取得</button>
  </div>
  <div class="login-form hidden" id="loginForm">
    <div class="field">
      <label for="ghTokenInput">GitHub Personal Access Token</label>
      <input type="password" id="ghTokenInput" placeholder="github_pat_xxxxxxxxxxxx" autocomplete="off">
    </div>
    <div class="login-actions">
      <button class="primary small" id="loginSubmitBtn">ログイン</button>
      <button class="ghost small" id="loginCancelBtn">キャンセル</button>
    </div>
    <p class="error-msg" id="loginError"></p>
    <p class="hint">順位表ページと同じトークンでログインできます。トークンはこの端末のブラウザにのみ保存されます。</p>
  </div>
  <p class="error-msg" id="globalError" style="text-align:center;"></p>

  <p class="scroll-hint">→ 横にスクロールしてご覧ください</p>
  <div class="bracket-scroll">
    <div class="bracket" id="bracketRoot"></div>
  </div>

  <footer>
    <p class="note">対戦結果（得点）を入力すると得点の高い方が自動的に勝ち進みます。入力・編集は、編集モードにログインした人だけが行えます。</p>
    <button class="ghost hidden" id="resetAllBtn">全データをリセット</button>
  </footer>

</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  // ============================================================
  // GitHub 設定：グループ予選ページ（index.html）と同じ値にしてください
  // ============================================================
  var REPO_OWNER = "YOUR_GITHUB_USERNAME";
  var REPO_NAME  = "YOUR_REPO_NAME";
  var BRANCH     = "main";
  var DATA_PATH  = "data/bracket.json";
  // ============================================================

  var GH_TOKEN_KEY = "naggy-cup-gh-token"; // index.html と同じキー（ログイン状態を共有）
  var isConfigured = (REPO_OWNER !== "YOUR_GITHUB_USERNAME" && REPO_NAME !== "YOUR_REPO_NAME");

  var ghToken = null;
  try{ ghToken = localStorage.getItem(GH_TOKEN_KEY) || null; }catch(e){}
  var isEditMode = !!ghToken;

  var state = null;

  /* ---------- geometry (fixed, for an 8-player bracket) ---------- */
  var G = { boxW:190, boxH:64, stub:24, gap1:40, baseTop:34, padLeft:10 };
  var box1Top = G.baseTop;                        // 34
  var box1CenterY = box1Top + G.boxH/2;            // 66
  var box2Top = box1Top + G.boxH + G.gap1;         // 138
  var box2CenterY = box2Top + G.boxH/2;            // 170
  var r2CenterY = (box1CenterY + box2CenterY)/2;   // 118
  var r2Top = r2CenterY - G.boxH/2;                // 86

  var xR1L = G.padLeft;                            // 10
  var xR1L_right = xR1L + G.boxW;                  // 200
  var xVlineL = xR1L_right + G.stub;                // 224
  var xR2L = xVlineL + G.stub;                      // 248
  var xR2L_right = xR2L + G.boxW;                   // 438
  var xFinal = xR2L_right + G.stub;                 // 462
  var xFinal_right = xFinal + G.boxW;               // 652
  var xR2R = xFinal_right + G.stub;                 // 676
  var xR2R_right = xR2R + G.boxW;                   // 866
  var xVlineR = xR2R_right + G.stub;                // 890
  var xR1R = xVlineR + G.stub;                      // 914
  var xR1R_right = xR1R + G.boxW;                   // 1104

  var championTop = r2Top + G.boxH + 16;            // 166
  var BRACKET_W = xR1R_right + G.padLeft;           // 1114
  var BRACKET_H = championTop + 70;                 // 236

  /* ---------- default state ---------- */
  function defaultState(){
    return {
      players: ["","","","","","","",""],
      matches: {
        m1:{s1:0,s2:0}, m2:{s1:0,s2:0}, m3:{s1:0,s2:0}, m4:{s1:0,s2:0},
        m5:{s1:0,s2:0}, m6:{s1:0,s2:0}, m7:{s1:0,s2:0}
      }
    };
  }

  function escapeHtml(str){
    return String(str==null?"":str).replace(/[&<>"']/g, function(c){
      return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c];
    });
  }

  /* ---------- GitHub storage (same pattern as index.html) ---------- */
  function utf8ToBase64(str){
    var bytes = new TextEncoder().encode(str);
    var binary = "";
    for(var i=0;i<bytes.length;i++){ binary += String.fromCharCode(bytes[i]); }
    return btoa(binary);
  }
  function authHeaders(extra){
    var h = {"Authorization":"Bearer "+ghToken, "Accept":"application/vnd.github+json"};
    if(extra){ for(var k in extra){ h[k]=extra[k]; } }
    return h;
  }
  function fetchRemoteState(){
    var url = "https://raw.githubusercontent.com/"+REPO_OWNER+"/"+REPO_NAME+"/"+BRANCH+"/"+DATA_PATH+"?t="+Date.now();
    return fetch(url, {cache:"no-store"}).then(function(res){
      if(res.status===404){ return defaultState(); }
      if(!res.ok) throw new Error("読み込みに失敗しました（status "+res.status+"）");
      return res.json().then(function(parsed){
        return (parsed && parsed.matches) ? parsed : defaultState();
      });
    });
  }
  function getFileSha(){
    var api = "https://api.github.com/repos/"+REPO_OWNER+"/"+REPO_NAME+"/contents/"+DATA_PATH+"?ref="+BRANCH;
    return fetch(api, {headers: authHeaders(), cache:"no-store"}).then(function(res){
      if(res.status===404) return null;
      if(!res.ok){ var e=new Error("SHA_FETCH_FAILED"); e.status=res.status; throw e; }
      return res.json();
    }).then(function(json){ return json ? json.sha : null; });
  }
  function commitState(){
    if(!ghToken) return Promise.reject(new Error("NOT_LOGGED_IN"));
    return getFileSha().then(function(sha){
      var api = "https://api.github.com/repos/"+REPO_OWNER+"/"+REPO_NAME+"/contents/"+DATA_PATH;
      var body = {
        message: "update bracket "+new Date().toISOString(),
        content: utf8ToBase64(JSON.stringify(state, null, 2)),
        branch: BRANCH
      };
      if(sha) body.sha = sha;
      return fetch(api, {
        method:"PUT",
        headers: authHeaders({"Content-Type":"application/json"}),
        body: JSON.stringify(body)
      });
    }).then(function(res){
      if(!res.ok){
        return res.json().catch(function(){return {};}).then(function(err){
          var e = new Error((err && err.message) || ("保存に失敗しました（status "+res.status+"）"));
          e.status = res.status;
          throw e;
        });
      }
      return res.json();
    });
  }
  function verifyToken(token){
    return fetch("https://api.github.com/repos/"+REPO_OWNER+"/"+REPO_NAME, {
      headers: {"Authorization":"Bearer "+token, "Accept":"application/vnd.github+json"}
    }).then(function(res){
      if(res.status===401) throw new Error("トークンが無効です。");
      if(res.status===404) throw new Error("リポジトリが見つかりません。REPO_OWNER / REPO_NAME を確認してください。");
      if(!res.ok) throw new Error("確認に失敗しました（status "+res.status+"）");
      return true;
    });
  }

  function showGlobalError(msg){ var el=document.getElementById("globalError"); if(el) el.textContent = msg; }
  function clearGlobalError(){ var el=document.getElementById("globalError"); if(el) el.textContent = ""; }

  function loadState(){
    if(!isConfigured){
      showGlobalError("まだ GitHub の設定が完了していません。HTMLファイル冒頭の REPO_OWNER / REPO_NAME を書き換えてから公開してください。");
      return Promise.resolve(defaultState());
    }
    clearGlobalError();
    return fetchRemoteState().catch(function(e){
      console.error("load error", e);
      showGlobalError("データの読み込みに失敗しました。リポジトリが public か、設定値をご確認ください。");
      return defaultState();
    });
  }
  function saveState(){
    if(!isConfigured){ showToast("GitHubの設定が未完了のため保存できません"); return Promise.reject(new Error("CONFIG_NOT_SET")); }
    return commitState().then(function(){
      showToast("GitHubに保存しました");
    }).catch(function(e){
      console.error("save error", e);
      if(e && (e.status===401 || e.status===403)){
        showToast("保存に失敗：トークンの権限をご確認ください");
        logout();
      } else {
        showToast("保存に失敗しました："+(e && e.message ? e.message : ""));
      }
    });
  }

  function showToast(msg){
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(showToast._tm);
    showToast._tm = setTimeout(function(){ t.classList.remove("show"); }, 2200);
  }

  /* ---------- login/logout ---------- */
  function openLogin(){
    document.getElementById("loginForm").classList.remove("hidden");
    document.getElementById("loginError").textContent = "";
    document.getElementById("ghTokenInput").value = "";
    document.getElementById("ghTokenInput").focus();
  }
  function closeLogin(){ document.getElementById("loginForm").classList.add("hidden"); }
  function submitLogin(){
    var input = document.getElementById("ghTokenInput");
    var err = document.getElementById("loginError");
    var token = input.value.trim();
    if(!isConfigured){ err.textContent = "先にHTML内の REPO_OWNER / REPO_NAME を設定してください。"; return; }
    if(!token){ err.textContent = "トークンを入力してください。"; return; }
    err.textContent = "確認中...";
    verifyToken(token).then(function(){
      ghToken = token;
      try{ localStorage.setItem(GH_TOKEN_KEY, token); }catch(e){}
      isEditMode = true;
      closeLogin();
      showToast("編集モードでログインしました");
      loadState().then(function(s){ state = s; renderAll(); });
    }).catch(function(e){
      err.textContent = e.message || "ログインに失敗しました。";
    });
  }
  function logout(){
    ghToken = null;
    try{ localStorage.removeItem(GH_TOKEN_KEY); }catch(e){}
    isEditMode = false;
    renderAll();
  }

  /* ---------- bracket logic ---------- */
  function seedName(i){ return (state.players[i] || "").trim(); }

  function computeWinner(matchId, name1, det1, name2, det2){
    var m = state.matches[matchId];
    if(!det1 || !det2 || !name1 || !name2) return {name:null, slot:null};
    if(m.s1 === m.s2) return {name:null, slot:null};
    return m.s1 > m.s2 ? {name:name1, slot:1} : {name:name2, slot:2};
  }

  function computeAll(){
    var w1 = computeWinner("m1", seedName(0), true, seedName(1), true);
    var w2 = computeWinner("m2", seedName(2), true, seedName(3), true);
    var w3 = computeWinner("m3", seedName(4), true, seedName(5), true);
    var w4 = computeWinner("m4", seedName(6), true, seedName(7), true);
    var w5 = computeWinner("m5", w1.name, !!w1.name, w2.name, !!w2.name);
    var w6 = computeWinner("m6", w3.name, !!w3.name, w4.name, !!w4.name);
    var w7 = computeWinner("m7", w5.name, !!w5.name, w6.name, !!w6.name);
    return {w1:w1,w2:w2,w3:w3,w4:w4,w5:w5,w6:w6,w7:w7};
  }

  /* ---------- rendering ---------- */
  function matchBoxHtml(opts){
    // opts: matchId, top, left, label, extraClass,
    // p1{name, editableSeed(idx or null), det, disabled}, p2{...}, winnerSlot
    var m = state.matches[opts.matchId];
    function rowHtml(p, scoreKey, slot){
      var isWinner = opts.winnerSlot === slot;
      var nameHtml;
      if(p.seedIndex != null){
        var val = escapeHtml(state.players[p.seedIndex] || "");
        nameHtml = '<input type="text" class="p-name" maxlength="16" placeholder="選手'+(p.seedIndex+1)+'" '+
                   'value="'+val+'" data-seed="'+p.seedIndex+'" '+(isEditMode?'':'disabled')+'>';
      } else {
        var shown = p.name ? escapeHtml(p.name) : "(未定)";
        nameHtml = '<span class="p-name static-name'+(p.name?' filled':'')+'">'+shown+'</span>';
      }
      var scoreDisabled = (!isEditMode || !p.det) ? "disabled" : "";
      var trophy = isWinner ? '<span class="trophy-mark">🏆</span>' : '';
      return '<div class="match-row'+(isWinner?' winner-row':'')+'">'+trophy+nameHtml+
             '<input type="number" class="p-score" min="0" value="'+(m[scoreKey]||0)+'" '+
             'data-match="'+opts.matchId+'" data-score="'+scoreKey+'" '+scoreDisabled+'></div>';
    }
    var html = '<div class="match-label" style="top:'+(opts.top-16)+'px;left:'+opts.left+'px;">'+opts.label+'</div>';
    html += '<div class="match-box'+(opts.extraClass?(' '+opts.extraClass):'')+'" style="top:'+opts.top+'px;left:'+opts.left+'px;">';
    html += rowHtml(opts.p1, "s1", 1);
    html += rowHtml(opts.p2, "s2", 2);
    html += '</div>';
    return html;
  }

  function stub(top,left,width,lit){
    return '<div class="stub'+(lit?' lit':'')+'" style="top:'+top+'px;left:'+left+'px;width:'+width+'px;"></div>';
  }
  function vline(top,left,height,lit){
    return '<div class="vline'+(lit?' lit':'')+'" style="top:'+top+'px;left:'+left+'px;height:'+height+'px;"></div>';
  }

  function renderBracket(){
    var w = computeAll();
    var html = "";

    // ---- Round1 Left (m1, m2) ----
    html += matchBoxHtml({matchId:"m1", top:box1Top, left:xR1L, label:"第1試合",
      p1:{seedIndex:0, det:true}, p2:{seedIndex:1, det:true}, winnerSlot:w.w1.slot});
    html += matchBoxHtml({matchId:"m2", top:box2Top, left:xR1L, label:"第2試合",
      p1:{seedIndex:2, det:true}, p2:{seedIndex:3, det:true}, winnerSlot:w.w2.slot});

    // connectors: R1L pair -> R2L
    html += stub(box1CenterY, xR1L_right, G.stub, !!w.w1.name);
    html += stub(box2CenterY, xR1L_right, G.stub, !!w.w2.name);
    html += vline(box1CenterY, xVlineL, box2CenterY-box1CenterY, (!!w.w1.name && !!w.w2.name));
    html += stub(r2CenterY, xVlineL, G.stub, (!!w.w1.name && !!w.w2.name));

    // ---- Round2 Left (m5) ----
    html += matchBoxHtml({matchId:"m5", top:r2Top, left:xR2L, label:"第5試合（準決勝）",
      p1:{name:w.w1.name, det:!!w.w1.name}, p2:{name:w.w2.name, det:!!w.w2.name}, winnerSlot:w.w5.slot});
    html += stub(r2CenterY, xR2L_right, G.stub, !!w.w5.name);

    // ---- Final (m7) ----
    html += matchBoxHtml({matchId:"m7", top:r2Top, left:xFinal, label:"第7試合（決勝）", extraClass:"final-box",
      p1:{name:w.w5.name, det:!!w.w5.name}, p2:{name:w.w6.name, det:!!w.w6.name}, winnerSlot:w.w7.slot});

    // champion card
    var champHtml = w.w7.name
      ? '<div class="cc-label">🏆 CHAMPION</div><div class="cc-name">'+escapeHtml(w.w7.name)+'</div>'
      : '<div class="cc-label">CHAMPION</div><div class="cc-name">優勝者未定</div>';
    html += '<div class="champion-card'+(w.w7.name?'':' empty')+'" style="top:'+championTop+'px;left:'+xFinal+'px;width:'+G.boxW+'px;">'+champHtml+'</div>';

    // ---- Round2 Right (m6) ----
    html += stub(r2CenterY, xFinal_right, G.stub, !!w.w6.name);
    html += matchBoxHtml({matchId:"m6", top:r2Top, left:xR2R, label:"第6試合（準決勝）",
      p1:{name:w.w3.name, det:!!w.w3.name}, p2:{name:w.w4.name, det:!!w.w4.name}, winnerSlot:w.w6.slot});

    // connectors: R2R -> R1R pair
    html += stub(r2CenterY, xR2R_right, G.stub, (!!w.w3.name && !!w.w4.name));
    html += vline(box1CenterY, xVlineR, box2CenterY-box1CenterY, (!!w.w3.name && !!w.w4.name));
    html += stub(box1CenterY, xVlineR+G.stub-2, G.stub, !!w.w3.name);
    html += stub(box2CenterY, xVlineR+G.stub-2, G.stub, !!w.w4.name);

    // ---- Round1 Right (m3, m4) ----
    html += matchBoxHtml({matchId:"m3", top:box1Top, left:xR1R, label:"第3試合",
      p1:{seedIndex:4, det:true}, p2:{seedIndex:5, det:true}, winnerSlot:w.w3.slot});
    html += matchBoxHtml({matchId:"m4", top:box2Top, left:xR1R, label:"第4試合",
      p1:{seedIndex:6, det:true}, p2:{seedIndex:7, det:true}, winnerSlot:w.w4.slot});

    var root = document.getElementById("bracketRoot");
    root.style.width = BRACKET_W+"px";
    root.style.height = BRACKET_H+"px";
    root.innerHTML = html;
  }

  function renderEditBar(){
    var statusEl = document.getElementById("editStatus");
    var loginBtn = document.getElementById("loginBtn");
    var logoutBtn = document.getElementById("logoutBtn");
    if(isEditMode){
      statusEl.textContent = "🔓 編集モード";
      loginBtn.classList.add("hidden");
      logoutBtn.classList.remove("hidden");
    } else {
      statusEl.textContent = "👁 閲覧モード";
      loginBtn.classList.remove("hidden");
      logoutBtn.classList.add("hidden");
    }
    document.getElementById("resetAllBtn").classList.toggle("hidden", !isEditMode);
  }

  function renderAll(){
    renderEditBar();
    renderBracket();
  }

  /* ---------- mutations ---------- */
  function setSeedName(idx, name){
    if(!isEditMode) return;
    state.players[idx] = name.trim().slice(0,16);
    saveState();
    renderAll();
  }
  function setScore(matchId, key, value){
    if(!isEditMode) return;
    var n = parseInt(value,10);
    if(isNaN(n) || n<0) n = 0;
    state.matches[matchId][key] = n;
    saveState();
    renderAll();
  }
  function resetAll(){
    if(!isEditMode) return;
    if(!window.confirm("トーナメント表のデータをすべてリセットします。この操作は取り消せません。よろしいですか？")) return;
    if(!window.confirm("本当によろしいですか？もう一度確認します。")) return;
    state = defaultState();
    saveState();
    renderAll();
  }

  /* ---------- events ---------- */
  function bindEvents(){
    document.getElementById("loginBtn").addEventListener("click", openLogin);
    document.getElementById("loginCancelBtn").addEventListener("click", closeLogin);
    document.getElementById("loginSubmitBtn").addEventListener("click", submitLogin);
    document.getElementById("ghTokenInput").addEventListener("keydown", function(e){ if(e.key==="Enter") submitLogin(); });
    document.getElementById("logoutBtn").addEventListener("click", logout);
    document.getElementById("refreshBtn").addEventListener("click", function(){
      loadState().then(function(s){ state = s; renderAll(); showToast("最新の結果を取得しました"); });
    });
    document.getElementById("resetAllBtn").addEventListener("click", resetAll);

    var root = document.getElementById("bracketRoot");
    root.addEventListener("change", function(e){
      if(e.target.matches(".p-name[data-seed]")){
        setSeedName(parseInt(e.target.getAttribute("data-seed"),10), e.target.value);
      } else if(e.target.matches(".p-score")){
        setScore(e.target.getAttribute("data-match"), e.target.getAttribute("data-score"), e.target.value);
      }
    });
    root.addEventListener("keydown", function(e){
      if((e.target.matches(".p-name[data-seed]") || e.target.matches(".p-score")) && e.key==="Enter"){
        e.target.blur();
      }
    });
  }

  /* ---------- init ---------- */
  document.getElementById("bracketRoot").innerHTML = '<p style="color:var(--ink-dim);padding:20px;">読み込み中...</p>';
  loadState().then(function(s){
    state = s;
    bindEvents();
    renderAll();
  });

})();
</script>
</body>
</html>
