<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>naggy杯 決勝トーナメント</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#05050a; --bg-1:#0c0d16;
    --card-bg:rgba(12,13,22,0.86); --card-border:rgba(212,175,55,0.55);
    --gold-1:#f6d365; --gold-2:#c9971f; --gold-3:#8a6a10;
    --ink:#f4f1e8; --ink-dim:#9a9baa;
    --danger:#e05252;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(ellipse 900px 500px at 8% -5%, rgba(56,110,255,0.28), transparent 60%),
      radial-gradient(ellipse 900px 500px at 95% 0%, rgba(230,60,60,0.24), transparent 60%),
      radial-gradient(ellipse 1200px 800px at 50% 110%, rgba(120,90,20,0.18), transparent 60%),
      linear-gradient(180deg, var(--bg-0), var(--bg-1) 40%, var(--bg-0));
    background-attachment:fixed;
    font-family:'Noto Sans JP', sans-serif;
    color:var(--ink);
    padding:28px 16px 60px;
  }
  .wrap{max-width:1180px;margin:0 auto;}

  header.hero{text-align:center;margin-bottom:10px;}
  .hero-title{
    font-size:clamp(24px, 5vw, 44px);line-height:1.15;margin:0;
    display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:baseline;
  }
  .hero-title .naggy{
    font-family:'Poppins',sans-serif;font-weight:800;font-style:italic;
    background:linear-gradient(180deg,#fff6d0 0%, var(--gold-1) 35%, var(--gold-2) 70%, var(--gold-3) 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 2px 0 rgba(0,0,0,0.35);
    filter:drop-shadow(0 0 18px rgba(201,151,31,0.45));
  }
  .hero-title .jp{font-weight:900;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,0.6);}
  .hero-sub{color:var(--ink-dim);font-size:13px;letter-spacing:0.06em;margin-top:6px;}
  .backlink{display:block;text-align:center;color:var(--ink-dim);font-size:12.5px;margin-bottom:20px;text-decoration:none;}
  .backlink:hover{color:var(--gold-1);}

  .editbar{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin:0 0 20px;}
  .edit-status{font-size:12.5px;color:var(--ink-dim);font-weight:700;letter-spacing:0.03em;}
  button{
    font-family:inherit;cursor:pointer;border:none;border-radius:9px;font-weight:700;font-size:13.5px;
    padding:9px 18px;transition:transform .1s ease, opacity .15s ease;
  }
  button.small{font-size:12px;padding:6px 12px;}
  button.primary{background:linear-gradient(180deg,var(--gold-1),var(--gold-2));color:#221a06;box-shadow:0 4px 14px rgba(201,151,31,0.35);}
  button.primary:hover{transform:translateY(-1px);}
  button.ghost{background:transparent;border:1px solid rgba(255,255,255,0.2);color:var(--ink-dim);}
  button.ghost:hover{color:var(--ink);border-color:rgba(255,255,255,0.4);}
  .hidden{display:none !important;}

  .login-form{
    max-width:420px;margin:0 auto 26px;background:var(--card-bg);border:1px solid var(--card-border);
    border-radius:12px;padding:16px 18px;box-shadow:0 8px 30px rgba(0,0,0,0.4);
  }
  .field{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--ink-dim);margin-bottom:10px;}
  .field input{
    background:rgba(0,0,0,0.35);border:1px solid rgba(255,255,255,0.15);border-radius:8px;
    color:var(--ink);padding:8px 10px;font-size:14px;font-family:inherit;
  }
  .login-actions{display:flex;gap:8px;}
  .login-form .hint{color:var(--ink-dim);font-size:11px;line-height:1.6;margin:10px 0 0;}
  .error-msg{color:var(--danger);font-size:12.5px;margin:6px 0 0;min-height:1em;}

  .bracket-scroll{overflow-x:auto;padding:10px 4px 20px;}
  .scroll-hint{display:none;text-align:center;color:var(--ink-dim);font-size:11.5px;margin-bottom:10px;}
  .bracket{position:relative;margin:0 auto;}

  .bracket-line-h{position:absolute;height:2px;background:rgba(154,155,170,0.35);}
  .bracket-line-h.lit{background:linear-gradient(90deg,var(--gold-2),var(--gold-1));box-shadow:0 0 6px rgba(212,175,55,0.5);}
  .bracket-line-v{position:absolute;width:2px;background:rgba(154,155,170,0.35);}
  .bracket-line-v.lit{background:linear-gradient(180deg,var(--gold-2),var(--gold-1));box-shadow:0 0 6px rgba(212,175,55,0.5);}

  .seed-input{
    position:absolute;background:rgba(0,0,0,0.4);border:1px solid rgba(212,175,55,0.55);
    border-radius:6px;color:var(--ink);font-size:12.5px;font-family:inherit;padding:0 8px;
    height:26px;text-align:center;
  }
  .seed-input:disabled{opacity:1;color:var(--ink);}
  .seed-input:focus{outline:none;border-color:var(--gold-1);box-shadow:0 0 0 2px rgba(212,175,55,0.25);}

  .result-label{
    position:absolute;font-size:12px;color:var(--ink);font-weight:700;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;border:1px solid rgba(212,175,55,0.3);
    background:rgba(0,0,0,0.28);border-radius:6px;padding:0 8px;height:26px;
    display:flex;align-items:center;
  }

  .match-tag{position:absolute;font-size:9.5px;color:var(--ink-dim);white-space:nowrap;letter-spacing:0.02em;}

  .score-input{
    position:absolute;width:27px;height:19px;background:rgba(0,0,0,0.45);border:1px solid rgba(255,255,255,0.18);
    border-radius:5px;color:var(--ink);font-size:11.5px;text-align:center;padding:0;z-index:2;
  }
  .score-input:disabled{opacity:0.3;}
  .score-input.win{border-color:var(--gold-1);background:rgba(212,175,55,0.22);color:var(--gold-1);font-weight:700;}
  .trophy-dot{position:absolute;font-size:11px;z-index:2;}

  .champion-label{
    position:absolute;text-align:center;font-size:15px;font-weight:900;color:var(--gold-1);
    border:1px solid var(--card-border);background:rgba(70,52,10,0.45);border-radius:8px;
    padding:0 10px;height:34px;display:flex;align-items:center;justify-content:center;
    text-shadow:0 0 10px rgba(212,175,55,0.5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .champion-label.empty{color:var(--ink-dim);font-weight:500;font-size:12px;text-shadow:none;border-color:rgba(255,255,255,0.15);}

  footer{text-align:center;margin-top:30px;}
  footer .note{color:var(--ink-dim);font-size:11.5px;line-height:1.7;max-width:560px;margin:0 auto 14px;}
  footer button{font-size:11.5px;padding:6px 14px;}

  .toast{
    position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
    background:rgba(20,18,10,0.95);border:1px solid var(--card-border);color:var(--ink);
    padding:10px 18px;border-radius:10px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,0.5);
    opacity:0;pointer-events:none;transition:opacity .25s ease;z-index:50;
  }
  .toast.show{opacity:1;}

  @media (max-width:700px){ .scroll-hint{display:block;} }
</style>
</head>
<body>
<div class="wrap">

  <header class="hero">
    <h1 class="hero-title"><span class="naggy">naggy杯</span><span class="jp">決勝トーナメント</span></h1>
    <div class="hero-sub">FINAL TOURNAMENT &middot; 8名参加</div>
  </header>
  <a class="backlink" href="index.html">← グループ予選順位表へ</a>

  <div class="editbar">
    <span class="edit-status" id="editStatus">👁 閲覧モード</span>
    <button class="ghost small" id="loginBtn">🔒 編集モードでログイン</button>
    <button class="ghost small hidden" id="logoutBtn">ログアウト</button>
    <button class="ghost small" id="refreshBtn">🔄 最新を取得</button>
  </div>
  <div class="login-form hidden" id="loginForm">
    <div class="field">
      <label for="ghTokenInput">GitHub Personal Access Token</label>
      <input type="password" id="ghTokenInput" placeholder="github_pat_xxxxxxxxxxxx" autocomplete="off">
    </div>
    <div class="login-actions">
      <button class="primary small" id="loginSubmitBtn">ログイン</button>
      <button class="ghost small" id="loginCancelBtn">キャンセル</button>
    </div>
    <p class="error-msg" id="loginError"></p>
    <p class="hint">順位表ページと同じトークンでログインできます。トークンはこの端末のブラウザにのみ保存されます。</p>
  </div>
  <p class="error-msg" id="globalError" style="text-align:center;"></p>

  <p class="scroll-hint">→ 横にスクロールしてご覧ください</p>
  <div class="bracket-scroll">
    <div class="bracket" id="bracketRoot"></div>
  </div>

  <footer>
    <p class="note">選手名は1回戦の欄にだけ入力します。得点を入れると得点の高い方が自動的に勝ち上がり、線がつながって表示されます。入力・編集は編集モードにログインした人だけが行えます。</p>
    <button class="ghost hidden" id="resetAllBtn">全データをリセット</button>
  </footer>

</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  // ============================================================
  // GitHub 設定：グループ予選ページ（index.html）と同じ値にしてください
  // ============================================================
  var REPO_OWNER = "YOUR_GITHUB_USERNAME";
  var REPO_NAME  = "YOUR_REPO_NAME";
  var BRANCH     = "main";
  var DATA_PATH  = "data/bracket.json";
  // ============================================================

  var GH_TOKEN_KEY = "naggy-cup-gh-token";
  var isConfigured = (REPO_OWNER !== "YOUR_GITHUB_USERNAME" && REPO_NAME !== "YOUR_REPO_NAME");

  var ghToken = null;
  try{ ghToken = localStorage.getItem(GH_TOKEN_KEY) || null; }catch(e){}
  var isEditMode = !!ghToken;

  var state = null;

  /* ---------- geometry (fixed, line-based bracket for 8 players) ---------- */
  var TOTAL_W = 1000, TOTAL_H = 200;
  var Y = [50, 86, 122, 158];                 // the 4 lane heights per side
  var JY1 = (Y[0]+Y[1])/2;                    // 68  - m1 / m3 junction y
  var JY2 = (Y[2]+Y[3])/2;                    // 140 - m2 / m4 junction y
  var JY3 = (JY1+JY2)/2;                      // 104 - m5 / m6 junction y
  var xPad = 10, LEN1 = 170, LEN2 = 170, LEN3 = 150;
  var xJleafL = xPad+LEN1;                    // 180
  var xJsemiL = xJleafL+LEN2;                 // 350
  var xJfinal = xJsemiL+LEN3;                 // 500
  var xJleafR = TOTAL_W - xJleafL;             // 820
  var xJsemiR = TOTAL_W - xJsemiL;             // 650
  var xSeedL = xPad;                          // 10
  var xSeedR = TOTAL_W - xPad;                // 990
  var SEED_BOX_W = 130;                       // width of the name box at each seed line's start

  /* ---------- default state ---------- */
  function defaultState(){
    return {
      players: ["","","","","","","",""],
      matches: {
        m1:{s1:0,s2:0}, m2:{s1:0,s2:0}, m3:{s1:0,s2:0}, m4:{s1:0,s2:0},
        m5:{s1:0,s2:0}, m6:{s1:0,s2:0}, m7:{s1:0,s2:0}
      }
    };
  }

  function escapeHtml(str){
    return String(str==null?"":str).replace(/[&<>"']/g, function(c){
      return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c];
    });
  }

  /* ---------- GitHub storage ---------- */
  function utf8ToBase64(str){
    var bytes = new TextEncoder().encode(str);
    var binary = "";
    for(var i=0;i<bytes.length;i++){ binary += String.fromCharCode(bytes[i]); }
    return btoa(binary);
  }
  function authHeaders(extra){
    var h = {"Authorization":"Bearer "+ghToken, "Accept":"application/vnd.github+json"};
    if(extra){ for(var k in extra){ h[k]=extra[k]; } }
    return h;
  }
  function fetchRemoteState(){
    var url = "https://raw.githubusercontent.com/"+REPO_OWNER+"/"+REPO_NAME+"/"+BRANCH+"/"+DATA_PATH+"?t="+Date.now();
    return fetch(url, {cache:"no-store"}).then(function(res){
      if(res.status===404){ return defaultState(); }
      if(!res.ok) throw new Error("読み込みに失敗しました（status "+res.status+"）");
      return res.json().then(function(parsed){
        return (parsed && parsed.matches) ? parsed : defaultState();
      });
    });
  }
  function getFileSha(){
    var api = "https://api.github.com/repos/"+REPO_OWNER+"/"+REPO_NAME+"/contents/"+DATA_PATH+"?ref="+BRANCH;
    return fetch(api, {headers: authHeaders(), cache:"no-store"}).then(function(res){
      if(res.status===404) return null;
      if(!res.ok){ var e=new Error("SHA_FETCH_FAILED"); e.status=res.status; throw e; }
      return res.json();
    }).then(function(json){ return json ? json.sha : null; });
  }
  function commitState(){
    if(!ghToken) return Promise.reject(new Error("NOT_LOGGED_IN"));
    return getFileSha().then(function(sha){
      var api = "https://api.github.com/repos/"+REPO_OWNER+"/"+REPO_NAME+"/contents/"+DATA_PATH;
      var body = {
        message: "update bracket "+new Date().toISOString(),
        content: utf8ToBase64(JSON.stringify(state, null, 2)),
        branch: BRANCH
      };
      if(sha) body.sha = sha;
      return fetch(api, {
        method:"PUT",
        headers: authHeaders({"Content-Type":"application/json"}),
        body: JSON.stringify(body)
      });
    }).then(function(res){
      if(!res.ok){
        return res.json().catch(function(){return {};}).then(function(err){
          var e = new Error((err && err.message) || ("保存に失敗しました（status "+res.status+"）"));
          e.status = res.status;
          throw e;
        });
      }
      return res.json();
    });
  }
  function verifyToken(token){
    return fetch("https://api.github.com/repos/"+REPO_OWNER+"/"+REPO_NAME, {
      headers: {"Authorization":"Bearer "+token, "Accept":"application/vnd.github+json"}
    }).then(function(res){
      if(res.status===401) throw new Error("トークンが無効です。");
      if(res.status===404) throw new Error("リポジトリが見つかりません。REPO_OWNER / REPO_NAME を確認してください。");
      if(!res.ok) throw new Error("確認に失敗しました（status "+res.status+"）");
      return true;
    });
  }

  function showGlobalError(msg){ var el=document.getElementById("globalError"); if(el) el.textContent = msg; }
  function clearGlobalError(){ var el=document.getElementById("globalError"); if(el) el.textContent = ""; }

  function loadState(){
    if(!isConfigured){
      showGlobalError("まだ GitHub の設定が完了していません。HTMLファイル冒頭の REPO_OWNER / REPO_NAME を書き換えてから公開してください。");
      return Promise.resolve(defaultState());
    }
    clearGlobalError();
    return fetchRemoteState().catch(function(e){
      console.error("load error", e);
      showGlobalError("データの読み込みに失敗しました。リポジトリが public か、設定値をご確認ください。");
      return defaultState();
    });
  }
  function saveState(){
    if(!isConfigured){ showToast("GitHubの設定が未完了のため保存できません"); return Promise.reject(new Error("CONFIG_NOT_SET")); }
    return commitState().then(function(){
      showToast("GitHubに保存しました");
    }).catch(function(e){
      console.error("save error", e);
      if(e && (e.status===401 || e.status===403)){
        showToast("保存に失敗：トークンの権限をご確認ください");
        logout();
      } else {
        showToast("保存に失敗しました："+(e && e.message ? e.message : ""));
      }
    });
  }

  function showToast(msg){
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(showToast._tm);
    showToast._tm = setTimeout(function(){ t.classList.remove("show"); }, 2200);
  }

  /* ---------- login/logout ---------- */
  function openLogin(){
    document.getElementById("loginForm").classList.remove("hidden");
    document.getElementById("loginError").textContent = "";
    document.getElementById("ghTokenInput").value = "";
    document.getElementById("ghTokenInput").focus();
  }
  function closeLogin(){ document.getElementById("loginForm").classList.add("hidden"); }
  function submitLogin(){
    var input = document.getElementById("ghTokenInput");
    var err = document.getElementById("loginError");
    var token = input.value.trim();
    if(!isConfigured){ err.textContent = "先にHTML内の REPO_OWNER / REPO_NAME を設定してください。"; return; }
    if(!token){ err.textContent = "トークンを入力してください。"; return; }
    err.textContent = "確認中...";
    verifyToken(token).then(function(){
      ghToken = token;
      try{ localStorage.setItem(GH_TOKEN_KEY, token); }catch(e){}
      isEditMode = true;
      closeLogin();
      showToast("編集モードでログインしました");
      loadState().then(function(s){ state = s; renderAll(); });
    }).catch(function(e){
      err.textContent = e.message || "ログインに失敗しました。";
    });
  }
  function logout(){
    ghToken = null;
    try{ localStorage.removeItem(GH_TOKEN_KEY); }catch(e){}
    isEditMode = false;
    renderAll();
  }

  /* ---------- bracket logic ---------- */
  function seedName(i){ return (state.players[i] || "").trim(); }

  function computeWinner(matchId, name1, det1, name2, det2){
    var m = state.matches[matchId];
    if(!det1 || !det2 || !name1 || !name2) return {name:null, slot:null};
    if(m.s1 === m.s2) return {name:null, slot:null};
    return m.s1 > m.s2 ? {name:name1, slot:1} : {name:name2, slot:2};
  }

  /* ---------- drawing helpers ---------- */
  function hline(y, x1, x2, lit){
    var left = Math.min(x1,x2), width = Math.abs(x2-x1);
    return '<div class="bracket-line-h'+(lit?' lit':'')+'" style="top:'+(y-1)+'px;left:'+left+'px;width:'+width+'px;"></div>';
  }
  function vline(x, y1, y2, lit){
    if(y1===y2) return '';
    var top = Math.min(y1,y2), height = Math.abs(y2-y1);
    return '<div class="bracket-line-v'+(lit?' lit':'')+'" style="top:'+top+'px;left:'+(x-1)+'px;height:'+height+'px;"></div>';
  }
  function seedInput(idx, x, y, mirrored){
    var val = escapeHtml(state.players[idx] || "");
    var width = 130;
    var left = mirrored ? (x-width) : x;
    return '<input type="text" class="seed-input" style="left:'+left+'px;top:'+(y-13)+'px;width:'+width+'px;" '+
      'maxlength="16" placeholder="選手'+(idx+1)+'" value="'+val+'" data-seed="'+idx+'" '+(isEditMode?'':'disabled')+'>';
  }
  function resultLabel(name, x, y, mirrored){
    if(!name) return '';
    var width = 140;
    var left = mirrored ? (x-4-width) : (x+4);
    var align = mirrored ? 'justify-content:flex-end;' : 'justify-content:flex-start;';
    return '<div class="result-label" style="left:'+left+'px;top:'+(y-13)+'px;width:'+width+'px;'+align+'">'+escapeHtml(name)+'</div>';
  }
  function matchTag(label, x, y, mirrored){
    var width=90;
    var left = mirrored ? (x-width/2) : (x-width/2);
    var align='text-align:center;';
    return '<div class="match-tag" style="left:'+left+'px;top:'+(y+8)+'px;width:'+width+'px;'+align+'">'+label+'</div>';
  }
  function scoreInputHtml(matchId, key, x, y, mirrored, enabled, isWinner){
    var val = state.matches[matchId][key] || 0;
    var width = 27;
    var left = mirrored ? (x+6) : (x-6-width);
    var html = '<input type="number" class="score-input'+(isWinner?' win':'')+'" style="left:'+left+'px;top:'+(y-10)+'px;" '+
      'min="0" value="'+val+'" data-match="'+matchId+'" data-score="'+key+'" '+(enabled?'':'disabled')+'>';
    if(isWinner){
      var tx = mirrored ? (left-15) : (left+width+2);
      html += '<span class="trophy-dot" style="left:'+tx+'px;top:'+(y-9)+'px;">🏆</span>';
    }
    return html;
  }

  function renderJunction(matchId, junctionX, y1, y2, destEndX, mirrored, name1, det1, name2, det2, label){
    var junctionY = (y1+y2)/2;
    var w = computeWinner(matchId, name1, det1, name2, det2);
    var decided = !!w.name;
    var html = "";
    html += vline(junctionX, y1, y2, decided);
    if(destEndX != null){
      html += hline(junctionY, junctionX, destEndX, decided);
      html += resultLabel(w.name, junctionX, junctionY, mirrored);
    }
    if(label) html += matchTag(label, junctionX, Math.max(y1,y2), mirrored);
    var enabled = isEditMode && det1 && det2;
    html += scoreInputHtml(matchId, "s1", junctionX, y1, mirrored, enabled, w.slot===1);
    html += scoreInputHtml(matchId, "s2", junctionX, y2, mirrored, enabled, w.slot===2);
    return {html:html, winner:w};
  }

  function renderBracket(){
    var html = "";

    // 8 leaf seed lines + name inputs
    for(var i=0;i<4;i++){
      html += hline(Y[i], xSeedL+SEED_BOX_W, xJleafL, false);
      html += seedInput(i, xSeedL, Y[i], false);
    }
    for(var j=0;j<4;j++){
      html += hline(Y[j], xJleafR, xSeedR-SEED_BOX_W, false);
      html += seedInput(4+j, xSeedR, Y[j], true);
    }

    var r1 = renderJunction("m1", xJleafL, Y[0], Y[1], xJsemiL, false, seedName(0), true, seedName(1), true, "第1試合");
    html += r1.html;
    var r2 = renderJunction("m2", xJleafL, Y[2], Y[3], xJsemiL, false, seedName(2), true, seedName(3), true, "第2試合");
    html += r2.html;
    var r3 = renderJunction("m3", xJleafR, Y[0], Y[1], xJsemiR, true, seedName(4), true, seedName(5), true, "第3試合");
    html += r3.html;
    var r4 = renderJunction("m4", xJleafR, Y[2], Y[3], xJsemiR, true, seedName(6), true, seedName(7), true, "第4試合");
    html += r4.html;

    var r5 = renderJunction("m5", xJsemiL, JY1, JY2, xJfinal, false, r1.winner.name, !!r1.winner.name, r2.winner.name, !!r2.winner.name, "第5試合(準決勝)");
    html += r5.html;
    var r6 = renderJunction("m6", xJsemiR, JY1, JY2, xJfinal, true, r3.winner.name, !!r3.winner.name, r4.winner.name, !!r4.winner.name, "第6試合(準決勝)");
    html += r6.html;

    // final (m7): sources arrive from opposite sides at the same height
    var w7 = computeWinner("m7", r5.winner.name, !!r5.winner.name, r6.winner.name, !!r6.winner.name);
    var enabled7 = isEditMode && !!r5.winner.name && !!r6.winner.name;
    var champStub = 65;
    html += scoreInputHtml("m7","s1", xJfinal-champStub, JY3, false, enabled7, w7.slot===1);
    html += scoreInputHtml("m7","s2", xJfinal+champStub, JY3, true, enabled7, w7.slot===2);

    // champion: shown as a label sitting directly on the line where the two finalists' lines meet
    var champText = w7.name ? ("🏆 "+escapeHtml(w7.name)) : "優勝者未定";
    html += '<div class="champion-label'+(w7.name?'':' empty')+'" style="left:'+(xJfinal-champStub)+'px;top:'+(JY3-17)+'px;width:'+(champStub*2)+'px;">'+champText+'</div>';

    var root = document.getElementById("bracketRoot");
    root.style.width = TOTAL_W+"px";
    root.style.height = TOTAL_H+"px";
    root.innerHTML = html;
  }

  function renderEditBar(){
    var statusEl = document.getElementById("editStatus");
    var loginBtn = document.getElementById("loginBtn");
    var logoutBtn = document.getElementById("logoutBtn");
    if(isEditMode){
      statusEl.textContent = "🔓 編集モード";
      loginBtn.classList.add("hidden");
      logoutBtn.classList.remove("hidden");
    } else {
      statusEl.textContent = "👁 閲覧モード";
      loginBtn.classList.remove("hidden");
      logoutBtn.classList.add("hidden");
    }
    document.getElementById("resetAllBtn").classList.toggle("hidden", !isEditMode);
  }

  function renderAll(){
    renderEditBar();
    renderBracket();
  }

  /* ---------- mutations ---------- */
  function setSeedName(idx, name){
    if(!isEditMode) return;
    state.players[idx] = name.trim().slice(0,16);
    saveState();
    renderAll();
  }
  function setScore(matchId, key, value){
    if(!isEditMode) return;
    var n = parseInt(value,10);
    if(isNaN(n) || n<0) n = 0;
    state.matches[matchId][key] = n;
    saveState();
    renderAll();
  }
  function resetAll(){
    if(!isEditMode) return;
    if(!window.confirm("トーナメント表のデータをすべてリセットします。この操作は取り消せません。よろしいですか？")) return;
    if(!window.confirm("本当によろしいですか？もう一度確認します。")) return;
    state = defaultState();
    saveState();
    renderAll();
  }

  /* ---------- events ---------- */
  function bindEvents(){
    document.getElementById("loginBtn").addEventListener("click", openLogin);
    document.getElementById("loginCancelBtn").addEventListener("click", closeLogin);
    document.getElementById("loginSubmitBtn").addEventListener("click", submitLogin);
    document.getElementById("ghTokenInput").addEventListener("keydown", function(e){ if(e.key==="Enter") submitLogin(); });
    document.getElementById("logoutBtn").addEventListener("click", logout);
    document.getElementById("refreshBtn").addEventListener("click", function(){
      loadState().then(function(s){ state = s; renderAll(); showToast("最新の結果を取得しました"); });
    });
    document.getElementById("resetAllBtn").addEventListener("click", resetAll);

    var root = document.getElementById("bracketRoot");
    root.addEventListener("change", function(e){
      if(e.target.matches(".seed-input[data-seed]")){
        setSeedName(parseInt(e.target.getAttribute("data-seed"),10), e.target.value);
      } else if(e.target.matches(".score-input")){
        setScore(e.target.getAttribute("data-match"), e.target.getAttribute("data-score"), e.target.value);
      }
    });
    root.addEventListener("keydown", function(e){
      if((e.target.matches(".seed-input[data-seed]") || e.target.matches(".score-input")) && e.key==="Enter"){
        e.target.blur();
      }
    });
  }

  /* ---------- init ---------- */
  document.getElementById("bracketRoot").innerHTML = '<p style="color:var(--ink-dim);padding:20px;">読み込み中...</p>';
  loadState().then(function(s){
    state = s;
    bindEvents();
    renderAll();
  });

})();
</script>
</body>
</html>
